<!DOCTYPE html>
<html>
<head>
  <title>Phishcord</title>
  <style>
    body {
      width: 300px;
      height: 400px;
      margin: 0;
      padding: 10px;
      background-color: #437ecb;
      font-family: Helvetica;
    }
    h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 15px;
      color: white;
    }
    h2 {
      text-align: center;
      font-size: 16px;
      margin-bottom: 15px;
      color: white;
    }
    img {
      display: block;
      margin: auto;
      width: 100px;
      height: 100px;
    }
    form {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: 200px;
    }
    label {
      font-size: 16px;
      margin-bottom: 10px;
    }
    textarea {
      height: 100px;
      resize: none;
      font-size: 16px;
      padding: 5px;
      background-color: #75a0d9;
      color: white;
      border: 1px solid #ccc;
    }
    /* https://getcssscan.com/css-buttons-examples */
    button {
      appearance: none;
      background-color: white;
      border-radius: 2px;
      box-sizing: border-box;
      color: #437ecb;
      cursor: pointer;
      display: inline-block;
      font-family: Helvetica;
      font-size: 24px;
      font-weight: 600;
      line-height: normal;
      margin: 0;
      min-height: 60px;
      min-width: 0;
      outline: none;
      padding: 16px 24px;
      text-align: center;
      text-decoration: none;
      transition: all 300ms cubic-bezier(.23, 1, 0.32, 1);
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      width: 100%;
      will-change: transform;
    }

    button:disabled {
      pointer-events: none;
    }

    button:hover {
      color: #fff;
      background-color: #75a0d9;
      box-shadow: rgba(0, 0, 0, 0.25) 0 8px 15px;
      transform: translateY(-2px);
    }

    button:active {
      box-shadow: none;
      transform: translateY(0);
    }
    p {
      text-align: center;
      font-size: 16px;
      margin-top: 20px;
      color: white;
    }
  </style>

</head>
<body>
  <h1>PHISHCORD</h1>
  <h2>AI-Powered Phishing Detector</h2>
  <!--<img src="img/icon16.jpg" alt="Logo">-->
  <br>
  <form id="email-form">
    <p>Enter the email text:</p>
    <textarea id="email-text"></textarea>
    <br>
    <button id="submit-button">PREDICT</button>
  </form>
  <p id="prediction-result"></p>
  <script src="popup.js"></script>
</body>
</html>
