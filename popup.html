<!DOCTYPE html>
<html>

<head>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" /> <!-- https://www.w3schools.com/icons/fontawesome_icons_intro.asp -->
  <title>Phishcord</title>
  <style>
    /* body style */
    body {
      margin: 0;
      padding: 10px;
      background-color: #437ecb;
      font-family: Helvetica;
      display: flex;
      justify-content: center;
      /* https://developer.mozilla.org/en-US/docs/Web/CSS/justify-content */
    }

    /* header style */
    h1 {
      text-align: center;
      font-size: 30px;
      color: white;
    }

    h2 {
      text-align: center;
      font-size: 18px;
      color: white;
    }

    /* form container style */
    form {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      height: 200px;
    }

    /* textarea style */
    textarea {
      height: 100px;
      resize: none;
      font-size: 16px;
      padding: 10px;
      background-color: #75a0d9;
      color: white;
      border-radius: 10px;
      /*box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2), 0 6px 20px 0 rgba(0,0,0,0.19);*/
      border-width: 0;
    }

    /* https://getcssscan.com/css-buttons-examples
       button style with hover effect  */
    button {
      background-color: white;
      border-radius: 10px;
      color: #437ecb;
      font-family: Helvetica;
      font-size: 20px;
      font-weight: 600;
      padding: 8px;
      text-align: center;
      transition: transform 0.1s ease-in-out;
      outline: none !important;
      width: 100%;
      margin: 0 auto;
      border-width: 0;
      position: relative;
      top: -5px;
      /* up */
    }

    button:hover {
      transform: scale(1.1);
    }

    /* paragraph style */
    p {
      text-align: center;
      font-size: 11px;
      color: white;
    }

    /* https://www.w3schools.com/howto/howto_css_style_hr.asp
       horizontal rule style */
    hr {
      width: 100%;
      border: none;
      border-top: 1px solid white;
      margin-top: 20px;
    }

    /* multiple divs styles */
    #iconDiv {
      height: 40px;
      resize: none;
      background-color: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2),
        0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }

    #predictDiv {
      height: auto;
      resize: none;
      background-color: #75a0d9;
      border-radius: 10px;
      position: relative;
      top: 15px;
      /* up */
    }

    #explainDiv {
      height: auto;
      resize: none;
      border-radius: 10px;
      background-color: #75a0d9;
      box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2),
        0 6px 20px 0 rgba(0, 0, 0, 0.19);
    }

    #settingDiv,
    #manualDiv,
    #autoDiv,
    #lime-explanation,
    #lime-explanation-auto,
    #result-explanation-auto-extra {
      height: auto;
      resize: none;
      visibility: visible;
      opacity: 1;
      transition: opacity 0.2s ease, visibility 0.2s ease;
      display: flex;
      flex-direction: column;
      text-align: left;
      padding-left: 10px;
      color: #ffffff;
    }

    /* fixed a bug where the top text isn't fully displayed after downgrading scikit-learn */
    #lime-explanation,
    #lime-explanation-auto {
      position: relative;
    }

    #settingDiv.hidden,
    #manualDiv.hidden {
      visibility: hidden;
      opacity: 0;
      max-height: 0;
    }

    .volume-toggle,
    .setting-toggle,
    .manual-toggle,
    .auto-toggle {
      margin-left: 35px;
      margin-top: 5px;
      font-size: 30px;
      color: #437ecb;
      cursor: pointer;
      transition: transform 0.1s ease-in-out;
    }

    .volume-toggle:hover,
    .setting-toggle:hover,
    .manual-toggle:hover,
    .auto-toggle:hover {
      transform: scale(1.15);
    }

    .loading-icon {
      position: relative;
      top: 15px;
      /* move down */
    }

    #prediction-result,
    #prediction-result-auto {
      position: relative;
      top: -16px;
      /* move down */
    }

    /* https://developer.chrome.com/blog/a-customizable-select 
       chrome 135 required 
       select style */
    select {
      &,
      &::picker(select) {
        appearance: base-select;
        background-color: #75a0d9;
        color: #fff;
        font-size: larger;
        font-weight: bold;
        box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2),
          0 6px 20px 0 rgba(0, 0, 0, 0.19);
        border-width: 0;
        padding: 8px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- title -->
    <h1>PHISHCORD</h1>

    <!-- icon bar -->
    <div id="iconDiv">
      <!-- https://www.w3schools.com/icons/tryit.asp?filename=tryicons_fa-volume-up -->
      <i id="settingIcon" class="fa fa-cog setting-toggle" aria-hidden="true"></i>
      <i id="manualIcon" class="fa fa-keyboard-o manual-toggle" aria-hidden="true"></i>
      <i id="volumeIcon" class="fa fa-volume-up volume-toggle" aria-hidden="true"></i>
    </div>

    <!-- select a model -->
    <div id="settingDiv" class="hidden">
      <hr />
      <h2>CHOOSE A MODEL</h2>
      <select id="model-select">
        <option value="svc_model.pkl">SVC</option>
        <option value="rf_model.pkl">Random Forest</option>
        <option value="nb_model.pkl">Naive Bayes</option>
        <option value="xg_model.pkl">XGBoost</option>
      </select>
    </div>

    <!-- manual detection -->
    <div id="manualDiv" class="hidden">
      <hr />
      <form id="email-form">
        <h2>MANUAL DETECT</h2>
        <textarea id="email-text"></textarea>
        <br />
        <button id="submit-button">
          <i class="fa fa-search" aria-hidden="true"></i> PREDICT
        </button>
      </form>

      <div id="predictDiv">
        <h1 id="prediction-result">
          <i class="fa fa-spinner loading-icon fa-spin" aria-hidden="true"></i>
        </h1>
      </div>

      <div id="explainDiv">
        <p id="lime-explanation"></p>
      </div>
    </div>

    <!-- auto detection -->
    <div id="autoDiv">
      <hr />
      <h2>AUTO DETECT</h2>
      <button id="toggle-script">
        <i class="fa fa-play" aria-hidden="true"></i> START
      </button>

      <div id="predictDiv">
        <h1 id="prediction-result-auto">
          <i class="fa fa-spinner loading-icon fa-spin" aria-hidden="true"></i>
        </h1>
        <p id="prediction-result-auto-extra"></p>
      </div>

      <div id="explainDiv">
        <p id="lime-explanation-auto"></p>
      </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
